name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pdf-page-compressor-windows
            icon: assets/icon.ico
            data_sep: ";"
          - os: ubuntu-latest
            artifact_name: pdf-page-compressor-linux
            icon: assets/icon.png
            data_sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfontconfig1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        # --onedir (not --onefile): a onefile build self-extracts its
        # payload to a temp dir at every launch, which looks like classic
        # malware-dropper behavior to Windows heuristics (Smart App
        # Control/SmartScreen) and made unsigned builds get blocked even
        # though the app itself hadn't changed. --onedir ships a plain
        # folder instead, avoiding that pattern.
        run: >
          pyinstaller --onedir --windowed --clean
          --name pdf-page-compressor
          --icon ${{ matrix.icon }}
          --add-data "assets${{ matrix.data_sep }}assets"
          run.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
